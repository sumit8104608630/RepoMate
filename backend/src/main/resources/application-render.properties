spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.forward-headers-strategy=native
server.tomcat.use-relative-redirects=true
server.tomcat.redirect-context-root=false

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=DEVPILOT_SESSION

app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}

spring.security.oauth2.client.registration.github.redirect-uri=${APP_BASE_URL:https://repomate-bfie.onrender.com}/login/oauth2/code/github

spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=openai/gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.options.model=openai/text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1536

spring.ai.vectorstore.pgvector.dimensions=1536

spring.flyway.baseline-on-migrate=false
