spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.forward-headers-strategy=native
server.tomcat.use-relative-redirects=true
server.tomcat.redirect-context-root=false
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.port-header=X-Forwarded-Port
server.tomcat.remoteip.host-header=X-Forwarded-Host
server.tomcat.remoteip.protocol-header-https-value=https
server.tomcat.basedir=/tmp

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.timeout=7d

app.frontend-url=${FRONTEND_URL:https://client-delta-gules-88.vercel.app}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:https://client-delta-gules-88.vercel.app}}

spring.security.oauth2.client.registration.github.redirect-uri=${APP_BASE_URL:https://repomate-bfie.onrender.com}/login/oauth2/code/github

spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=nvidia/nemotron-3.5-lightning:free
spring.ai.openai.chat.options.temperature=0.2
app.ai.max-tokens=512
spring.ai.openai.embedding.options.model=nvidia/nemotron-3-embed-1b:free
spring.ai.openai.embedding.options.dimensions=2048

spring.ai.vectorstore.pgvector.dimensions=2048
spring.ai.vectorstore.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.id-column-name=id
spring.ai.vectorstore.pgvector.content-column-name=content
spring.ai.vectorstore.pgvector.metadata-column-name=metadata
spring.ai.vectorstore.pgvector.embedding-column-name=embedding

spring.flyway.baseline-on-migrate=false

app.keepalive.enabled=true
app.keepalive.self-ping.url=https://repomate-bfie.onrender.com/api/health
