spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/DevPilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sss81046}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=2

spring.ai.openai.api-key=${OPENROUTER_API_KEY}

spring.ai.openai.base-url=https://openrouter.ai/api/v1

spring.ai.openai.chat.options.model=nvidia/nemotron-3.5-lightning:free
spring.ai.openai.chat.options.temperature=0.2
app.ai.max-tokens=512

spring.ai.openai.embedding.options.model=nvidia/nemotron-3-embed-1b:free
spring.ai.openai.embedding.options.dimensions=2048

server.port=8081
server.servlet.session.cookie.name=DEVPILOT_SESSION

spring.ai.vectorstore.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=2048
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.id-column-name=id
spring.ai.vectorstore.pgvector.content-column-name=content
spring.ai.vectorstore.pgvector.metadata-column-name=metadata
spring.ai.vectorstore.pgvector.embedding-column-name=embedding



spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.redirect-uri=${APP_BASE_URL:http://localhost:8081}/login/oauth2/code/github
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id


server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d


app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.token-encryptor.password=${TOKEN_ENCRYPTOR_PASSWORD:dev-local-secret-change-me-in-prod}
app.token-encryptor.salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://client-delta-gules-88.vercel.app}
app.cors.allowed-methods=GET,POST,PUT,DELETE
app.indexing.chunk-size=500
app.indexing.chunk-overlap=50
app.indexing.api-delay-ms=50
spring.ai.model.embedding=openai

spring.ai.vectorstore.pgvector.dimensions=1536
app.keepalive.enabled=true
app.keepalive.self-ping.url=