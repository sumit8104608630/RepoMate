services:
  - type: web
    name: repomate-bfie
    runtime: docker
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /error
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: APP_PRODUCTION_MODE
        value: "true"
      - key: DB_URL
        fromDatabase:
          name: devpilot-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: devpilot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: devpilot-db
          property: password
      - key: SERVER_PORT
        value: "8081"
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      - key: SERVER_SERVLET_SESSION_COOKIE_SECURE
        value: "true"
      - key: SERVER_SERVLET_SESSION_COOKIE_SAME_SITE
        value: none
      - key: APP_BASE_URL
        value: https://repomate-bfie.onrender.com
      - key: FRONTEND_URL
        value: https://client-delta-gules-88.vercel.app
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://client-delta-gules-88.vercel.app
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTOR_PASSWORD
        generateValue: true
      - key: TOKEN_ENCRYPTOR_SALT
        generateValue: true
    domains:
      - repomate-bfie.onrender.com

  - type: web
    name: devpilot-client
    runtime: node
    rootDir: ./client
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://repomate-bfie.onrender.com
    domains:
      - devpilot-client.onrender.com

databases:
  - name: devpilot-db
    plan: standard
    databaseName: devpilot
    postgresMajorVersion: "17"
    postgresAdvancedFlags: "shared_preload_libraries=vector"
    ipAllowList: []
